[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.1.0"
description = "Your second brain. Fully local. Zero cloud. No PyTorch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "engram contributors" }]
keywords = ["second-brain", "rag", "local", "private", "knowledge-base", "embeddings", "onnx"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
]
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.16",
    "tokenizers>=0.15",
    "huggingface-hub>=0.20",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
docs = ["pypdf>=4.0", "python-docx>=1.1", "openpyxl>=3.1", "ebooklib>=0.18", "beautifulsoup4>=4.12", "markdownify>=0.11", "lxml>=4.9"]
fast = ["hnswlib>=0.7"]
all = ["engram[docs,fast]"]
dev = ["pytest>=7.0"]

[project.scripts]
engram = "engram.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
